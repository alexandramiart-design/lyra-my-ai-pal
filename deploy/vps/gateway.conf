# Passerelle OpenAI-compatible unique pour Lyra (http://127.0.0.1:8080/v1/...)
server {
  listen 80;
  client_max_body_size 50m;
  proxy_read_timeout 600s;
  proxy_buffering off;

  location /v1/chat/completions {
    proxy_pass http://ollama:11434/v1/chat/completions;
  }
  location /v1/models {
    proxy_pass http://ollama:11434/v1/models;
  }
  location /v1/audio/transcriptions {
    proxy_pass http://whisper:8000/v1/audio/transcriptions;
  }
  location /v1/audio/speech {
    proxy_pass http://tts:8000/v1/audio/speech;
  }
  # G√©nø©ration d'images : n√©scessite un service supp√©mentaire (voir README)
  location /v1/images/generations {
    return 501 '{"error":{"message":"image generation not enabled on this server"}}';
    add_header Content-Type application/json;
  }
}